<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2340;--mut:#7a6f8f;--acc:#ff7a59;--ok:#2fbf71;--star:#ffc233;--bar:#eadfcb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1830;--card:#2b2444;--ink:#f5f0ff;--mut:#b3a8cc;--bar:#3d3560;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1830;--card:#2b2444;--ink:#f5f0ff;--mut:#b3a8cc;--bar:#3d3560;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:960px;margin:0 auto;padding:16px}
.brand{font-size:22px;font-weight:700;margin:0 4px 10px;color:var(--mut)}
.tabs{display:flex;gap:12px;margin-bottom:12px}
.tab{flex:1;font:inherit;font-size:24px;font-weight:700;padding:14px;border-radius:24px;border:3px solid var(--bar);background:var(--card);color:var(--ink);cursor:pointer}
.tab.on{border-color:var(--acc);background:var(--acc);color:#fff}
.top{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:28px;padding:16px 20px;box-shadow:0 4px 0 var(--bar)}

#pet.hop{transform:scale(1.3) rotate(-8deg)}
.info{flex:1;min-width:0}
h1{margin:0 0 4px;font-size:26px}
.msg{color:var(--mut);font-size:18px;margin-bottom:8px}
.money{display:flex;gap:10px;flex-wrap:wrap;font-size:22px;font-weight:700}
.money span{background:var(--bg);border-radius:16px;padding:8px 14px}
#pay{display:none;margin-top:12px;padding:16px;border-radius:24px;background:var(--star);color:#3a2a00;text-align:center;font-size:24px;font-weight:700}
#wk{margin:16px 4px 0;color:var(--mut);font-size:18px;font-weight:700}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.card{background:var(--card);border-radius:28px;padding:12px;box-shadow:0 5px 0 var(--bar);display:flex;flex-direction:column;gap:8px}
.task{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;min-height:120px;padding:14px 10px;border:0;border-radius:22px;background:var(--bg);color:var(--ink);font:inherit;font-size:21px;font-weight:700;cursor:pointer}
.task:active{transform:scale(.97)}
.task .e{font-size:48px}
.task.done{background:var(--ok);color:#fff}
.wkr{display:flex;justify-content:space-between}
.dy{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
.dy i{font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid var(--bar);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.dy.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.dy.now i{border-color:var(--acc);border-width:3px}
.dy.fut{opacity:.45}
.un{align-self:flex-end;font:inherit;font-size:14px;padding:6px 12px;border-radius:12px;border:2px solid var(--bar);background:var(--card);color:var(--mut);cursor:pointer}
.un:disabled{opacity:.35}
.pop{position:fixed;font-size:40px;pointer-events:none;animation:up 1s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-120px) scale(1.5);opacity:0}}
.eggs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.eggb{border:4px solid transparent;background:var(--bg);border-radius:24px;padding:8px 12px;cursor:pointer}
.eggb.on{border-color:var(--acc);background:var(--card)}
#sn2{width:100%;font:inherit;font-size:26px;padding:12px;border-radius:16px;border:3px solid var(--bar);background:var(--bg);color:var(--ink)}
.go{font:inherit;font-size:24px;font-weight:700;padding:14px 28px;border:0;border-radius:20px;background:var(--ok);color:#fff;cursor:pointer}
.qz{margin-top:16px;background:var(--card);border-radius:28px;padding:18px;box-shadow:0 4px 0 var(--bar);font-size:20px}
.qq{margin:8px 0 12px}
.qo{display:block;width:100%;margin:8px 0;font:inherit;font-size:20px;padding:14px;border-radius:18px;border:3px solid var(--bar);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.adult{margin-top:24px;text-align:center}
button.s,.panel button{font:inherit;font-size:16px;padding:10px 16px;border-radius:14px;border:2px solid var(--bar);background:var(--card);color:var(--ink);cursor:pointer}
.panel{display:none;margin-top:12px;background:var(--card);border-radius:20px;padding:16px;text-align:left}
.panel input,.panel select{font:inherit;font-size:16px;padding:10px;border-radius:12px;border:2px solid var(--bar);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function showSetup(k){const s=$("setup"),g=$("game");
 if(k.ok){s.style.display="none";g.style.display="block";return}

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(r,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function todayQ(k){
 const dn=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),r=rng(dn*131+k.id*17),t=(dn+k.id)%5,ri=(a,b)=>a+Math.floor(r()*(b-a+1));
 if(t===2||t===4)return QF[(Math.floor(dn/5)*2+(t===4?1:0)+k.id*7)%QF.length];
 if(t===1||t===3){
  const m=ri(0,10);let q,a,e,u=" €",st=1;
  if(m===0){const n=ri(2,9),p=ri(2,9);q="Ostat "+n+" lakua, joka maksaa "+p+" € kappale. Paljonko maksat yhteensä?";a=n*p;e=n+" × "+p+" = "+a+" €.";st=p}
  else if(m===1){const c=ri(2,9),pay=c+ri(1,9);q="Maksat "+pay+" € ja ostokset maksavat "+c+" €. Paljonko saat vaihtorahaa?";a=pay-c;e=pay+" − "+c+" = "+a+" €."}
  else if(m===2){const x=ri(120,480),y=ri(120,480);q="Paljonko on "+x+" + "+y+"?";a=x+y;u="";e=x+" + "+y+" = "+a+".";st=10}
  else if(m===3){const w=ri(2,8),n=ri(3,12);q="Säästät "+w+" € viikossa. Paljonko sinulla on "+n+" viikon päästä?";a=w*n;e=w+" × "+n+" = "+a+" €.";st=w}
  else if(m===4){const w=ri(2,8),n=ri(4,15);q="Kuinka monta viikkoa menee "+(w*n)+" euron säästämiseen, jos säästät "+w+" € viikossa?";a=n;u=" viikkoa";e=(w*n)+" ÷ "+w+" = "+n+" viikkoa."}
  else if(m===5){const x=ri(3,12),y=ri(3,12);q="Paljonko on "+x+" × "+y+"?";a=x*y;u="";e=x+" × "+y+" = "+a+".";st=x}
  else if(m===6){const x=ri(300,900),y=ri(50,250);q="Paljonko on "+x+" − "+y+"?";a=x-y;u="";e=x+" − "+y+" = "+a+".";st=10}
  else if(m===7){const y=ri(2,9),z=ri(3,12);q="Paljonko on "+(y*z)+" ÷ "+y+"?";a=z;u="";e=(y*z)+" ÷ "+y+" = "+a+", koska "+y+" × "+a+" = "+(y*z)+"."}
  else if(m===8){const h=ri(0,1)===0,n=h?ri(2,40)*2:ri(2,20)*4,d=h?2:4;q="Paljonko on "+(h?"puolet":"neljäsosa")+" luvusta "+n+"?";a=n/d;u="";e=(h?"Puolet":"Neljäsosa")+" saadaan jakamalla luku "+d+":lla: "+n+" ÷ "+d+" = "+a+".";st=h?2:1}
  else if(m===9){const n=ri(2,6),h=ri(0,1)===0;q=h?"Montako minuuttia on "+n+" tunnissa?":"Montako päivää on "+n+" viikossa?";a=h?n*60:n*7;u="";e=h?"1 tunti on 60 minuuttia: "+n+" × 60 = "+a+".":"1 viikossa on 7 päivää: "+n+" × 7 = "+a+".";st=h?30:7}
  else{const x=ri(3,12),y=ri(2,9),p=ri(0,1)===0;q="Suorakulmion sivut ovat "+x+" cm ja "+y+" cm. Mikä on "+(p?"ympärysmitta":"pinta-ala")+"?";a=p?2*(x+y):x*y;u=p?" cm":" cm²";e=p?"Ympärysmitta on kaikkien sivujen summa: 2 × ("+x+" + "+y+") = "+a+" cm.":"Pinta-ala on leveys × korkeus: "+x+" × "+y+" = "+a+" cm².";st=p?2:Math.max(2,Math.round(a/6))}
  const o=shuffle(r,opts(r,a,st)).map(v=>v+u);return[q,o,o.indexOf(a+u),e];
 }
 const w=WD[(dn+k.id*37)%WD.length],rev=Math.floor(dn/5)%2===1,pool=shuffle(r,WD.filter(x=>x!==w)),o=shuffle(r,[w,pool[0],pool[1]]);
 return["🇬🇧 "+(rev?"Mitä sana "+w[1]+" tarkoittaa suomeksi?":"Miten sanotaan englanniksi: "+w[0]+"?"),o.map(x=>rev?x[0]:x[1]),o.indexOf(w),w[0]+" = "+w[1]+"."];
}
function quizDraw(k){const z=$("quiz");z.innerHTML="";if(!k.ok)return;
 const d=today(),c=document.createElement("div");c.className="qz";z.appendChild(c);
 const h=document.createElement("b");h.textContent="🧠 Päivän kysymys";c.appendChild(h);
 const p=document.createElement("div");p.className="qq";c.appendChild(p);
 if(k.qd===d){p.textContent=(k.qr||"")+" Uusi kysymys huomenna!";return}
 if(!k.log.some(e=>e[0]===d)){p.textContent="🔒 Tee ensin yksi kotityö, niin avaat päivän kysymyksen ja bonustähden!";return}
 const q=todayQ(k);p.textContent=q[0];
 q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="qo";b.textContent=o;b.onclick=()=>{const ok=i===q[2];if(ok){k.stars++;k.total++}k.qd=d;k.qr=(ok?"✅ Oikein! +1 ⭐ ":"💡 Ei aivan. ")+q[3];save();render()};c.appendChild(b)})}
/* Viikkotaulu su–la */
function pop(x,y){const s=document.createElement("div");s.className="pop";s.textContent="⭐";s.style.left=x-20+"px";s.style.top=y-20+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
function add(id,ev){const k=K();k.log.push([today(),id]);k.stars++;k.total++;pop(ev.clientX,ev.clientY);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
 const p=$("pet");p.classList.add("hop");setTimeout(()=>p.classList.remove("hop"),300);save();render()}
function undo(id){const k=K(),d=today();for(let i=k.log.length-1;i>=0;i--)if(k.log[i][0]===d&&k.log[i][1]===id){k.log.splice(i,1);k.stars=Math.max(0,k.stars-1);k.total=Math.max(0,k.total-1);break}save();render()}
function board(k){
 const L=$("list");L.innerHTML="";const n=new Date(),sun=new Date(n.getFullYear(),n.getMonth(),n.getDate()-n.getDay()),dd=[];
 for(let i=0;i<7;i++)dd.push(ld(new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+i)));
 const sat=new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+6),td=today();
 $("wk").textContent="Tämä viikko: "+sun.getDate()+"."+(sun.getMonth()+1)+". – "+sat.getDate()+"."+(sat.getMonth()+1)+". (su–la)";
 k.tasks.forEach(t=>{
  const cnt=day=>k.log.filter(e=>e[0]===day&&e[1]===t.id).length,tn=cnt(td);
  const c=document.createElement("div");c.className="card";
  const b=document.createElement("button");b.className="task"+(tn?" done":"");b.innerHTML='<span class="e"></span><span></span>';
  b.children[0].textContent=t.e;b.children[1].textContent=t.t+(tn>1?" ×"+tn:"");b.onclick=ev=>add(t.id,ev);c.appendChild(b);
  const w=document.createElement("div");w.className="wkr";
  dd.forEach((day,i)=>{const m=cnt(day),s=document.createElement("div");s.className="dy"+(day===td?" now":"")+(m?" on":"")+(day>td?" fut":"");s.innerHTML="<small></small><i></i>";s.children[0].textContent=DN[i];s.children[1].textContent=m||"";w.appendChild(s)});
  c.appendChild(w);
  const u=document.createElement("button");u.className="un";u.textContent="↩ Kumoa";u.disabled=!tn;u.onclick=()=>undo(t.id);c.appendChild(u);
  L.appendChild(c)});
}
function render(){
 const k=K(),dow=new Date().getDay(),days=(6-dow+7)%7,td=today();
 $("tabs").innerHTML="";
 S.kids.forEach(x=>{const b=document.createElement("button");b.className="tab"+(x.id===k.id?" on":"");b.textContent=x.ok?x.name:"➕ Uusi profiili";b.onclick=()=>{S.cur=x.id;save();render()};$("tabs").appendChild(b)});
 showSetup(k);petDraw(k);board(k);quizDraw(k);
 $("hello").textContent="Hei, "+k.name+"!";
 $("msg").textContent="Tänään tehty "+k.log.filter(e=>e[0]===td).length+" kotityötä. "+(days===0?"":"Maksupäivään "+days+" pv");
 $("st").textContent="⭐ "+k.stars+" = "+eur(k.stars*S.rate);
 $("pt").textContent="🐷 Potti "+eur(k.pot);
 const p=$("pay");p.style.display=dow===6?"block":"none";p.textContent="💶 Maksupäivä! Sinulle kertyi "+eur(k.stars*S.rate)+". Näytä aikuiselle!";
 $("nm").value=k.name;
 $("rate").innerHTML=[10,20,25,50,100].map(c=>'<option value="'+c+'"'+(c===S.rate?" selected":"")+">"+eur(c)+"</option>").join("");
 $("due").textContent=k.name+": maksettavaa "+eur(k.stars*S.rate)+", potissa "+eur(k.pot);
 const dl=$("del");dl.innerHTML="";
 k.tasks.forEach(t=>{const b=document.createElement("button");b.textContent="🗑️ "+t.e+" "+t.t;b.onclick=()=>{k.tasks=k.tasks.filter(x=>x.id!==t.id);save();render()};dl.appendChild(b)});
}
/* Aikuisten osio */
let unlocked=false;
function gate(){const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);window._ans=a*b;$("gq").textContent=a+" × "+b+" = ";$("ga").value=""}
$("tg").onclick=()=>{const p=$("panel"),o=p.style.display==="block";p.style.display=o?"none":"block";if(o){unlocked=false}else{$("gate").style.display=unlocked?"none":"flex";$("adm").style.display=unlocked?"block":"none";gate()}};
$("go").onclick=()=>{if(+$("ga").value===window._ans){unlocked=true;$("gate").style.display="none";$("adm").style.display="block"}else gate()};
$("sn").onclick=()=>{const v=$("nm").value.trim();if(v){K().name=v;save();render()}};
function addTask(all){const t=$("nt").value.trim();if(!t)return;const e=$("ne").value.trim()||"✨",id=Date.now();(all?S.kids:[K()]).forEach(k=>k.tasks.push({id,e,t}));$("nt").value="";$("ne").value="";save();render()}
$("add").onclick=()=>addTask(false);$("add2").onclick=()=>addTask(true);
$("rate").onchange=e=>{S.rate=+e.target.value;save();render()};
$("po").onclick=()=>{K().stars=0;save();render()};
$("tp").onclick=()=>{const k=K();k.pot+=k.stars*S.rate;k.stars=0;save();render()};
$("wb").onclick=()=>{const v=Math.round(parseFloat($("wd").value.replace(",","."))*100);if(v>0){const k=K();k.pot=Math.max(0,k.pot-v);$("wd").value="";save();render()}};
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
